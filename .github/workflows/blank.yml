name: Build NSE Option Analyzer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          mkdir -p build-src

          unzip -q "NSE_Option_Chain_Analyzer_Mobile_APK_Build.zip" -d build-src

          echo "Extracted files:"
          find build-src -maxdepth 5 -type f | head -200

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find build-src -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found"
            find build-src -maxdepth 6 -type f
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle wrapper --gradle-version 8.7

          chmod +x gradlew

          echo "Gradle wrapper generated successfully"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NSE-Option-Analyzer-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
