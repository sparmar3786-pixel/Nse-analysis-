name: Build NSE Option Analyzer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          echo "Checking repository..."

          if [ -f "build-src/settings.gradle" ] || [ -f "build-src/settings.gradle.kts" ]; then
            echo "Android project already exists in build-src"
          else
            echo "Searching for Android APK ZIP..."

            ZIP_FILE=$(find . -type f -iname "*.zip" | grep -Ei "mobile.*apk|apk.*build" | head -n 1 || true)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project ZIP not found."
              echo "Available ZIP files:"
              find . -type f -iname "*.zip"
              exit 1
            fi

            echo "Using ZIP: $ZIP_FILE"

            mkdir -p build-src
            unzip -q "$ZIP_FILE" -d build-src
          fi

          echo "Searching for settings.gradle..."

          PROJECT_DIR=$(find build-src -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            find build-src -maxdepth 6 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          gradle wrapper --gradle-version 8.7

          chmod +x gradlew

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NSE-Option-Analyzer-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
